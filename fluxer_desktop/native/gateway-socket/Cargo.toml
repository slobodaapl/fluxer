[package]
name = "fluxer_gateway_socket"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["napi"]
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[dependencies]
futures-util = {version = "0.3.32", default-features = false, features = ["sink", "std"]}
napi = {version = "3.12.6", default-features = false, features = ["dyn-symbols", "napi8"], optional = true}
napi-derive = {version = "3.6.7", optional = true}
rustls = {version = "0.23.40", default-features = false, features = ["ring", "std"]}
rustls-native-certs = "0.8.4"
tokio = {version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"]}
tokio-tungstenite = {version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"]}
url = "2.5.8"

[build-dependencies]
napi-build = {version = "2.4.3", optional = true}

[target.'cfg(windows)'.dependencies]
schannel = "0.1.29"
