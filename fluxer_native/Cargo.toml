[workspace]
members = ["crates/core", "crates/protocol", "crates/desktop", "crates/media", "crates/system-audio", "crates/client", "crates/session"]
resolver = "2"
exclude = ["compat/xattr", "compat/livekit", "compat/gpui", "compat/blade-graphics"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
fluxer-core = { path = "crates/core" }
fluxer-protocol = { path = "crates/protocol" }
fluxer-media = { path = "crates/media" }
fluxer-client = { path = "crates/client" }

# GPUI 0.2.2's zed-async-tar dependency requests xattr 0.2.3, which uses
# libc::ENOATTR removed on Linux. Forward its public API to maintained xattr.
[patch.crates-io]
xattr = { path = "compat/xattr" }

# Keep RTC handles through explicit unsubscribe and preserve ordered SFU demand.
livekit = { path = "compat/livekit" }

# Recover Wayland repainting independently of a suspended compositor callback.
gpui = { path = "compat/gpui" }

# Return Vulkan surface failures to GPUI so it can rebuild the swapchain.
blade-graphics = { path = "compat/blade-graphics" }

# Video capture, pixel handling and GPUI rendering must meet real-time budgets
# in development builds too. Keep debug symbols/assertions and optimize only
# the frame-processing crates rather than rebuilding every dependency.
[profile.dev.package.fluxer-desktop]
opt-level = 2

[profile.dev.package.fluxer-media]
opt-level = 2

[profile.dev.package.gpui]
opt-level = 2

[profile.dev.package.image]
opt-level = 2
