[package]
name = "fluxer_platform_info"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["napi"]
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[dependencies]
napi = {version = "3.12.6", default-features = false, features = ["dyn-symbols", "napi8"], optional = true}
napi-derive = {version = "3.6.7", optional = true}

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = {version = "0.6.4", features = ["exception"]}
objc2-foundation = {version = "0.3.2", default-features = false, features = ["NSArray", "NSObject", "NSString", "std"]}
objc2-metal = {version = "0.3.2", default-features = false, features = ["MTLDevice", "std"]}

[target.'cfg(target_os = "windows")'.dependencies]
windows = {version = "0.62.2", features = [
	"Win32_Foundation",
	"Win32_Graphics_Dxgi",
]}

[build-dependencies]
napi-build = {version = "2.4.3", optional = true}
