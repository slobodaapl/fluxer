[package]
name = "fluxer-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fluxer-core.workspace = true
fluxer-protocol.workspace = true
fluxer-media.workspace = true
fluxer-session = { path = "../session" }
serde.workspace = true
serde_json.workspace = true
chrono = "0.4"
reqwest = { version = "=0.12.24", default-features = false }
image = {version="0.25",default-features=false,features=["png","jpeg","gif","webp"]}
tempfile = "3"
mime_guess = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect"] }
futures-util = "0.3"
zstd = { version = "=0.14.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
libc = "0.2"
