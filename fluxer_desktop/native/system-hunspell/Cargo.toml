[package]
name = "fluxer_system_hunspell"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["napi"]
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[dependencies]
hunspell-sys = {version = "0.3.1", features = ["bundled"]}
napi = {version = "3.12.6", default-features = false, features = ["dyn-symbols", "napi8"], optional = true}
napi-derive = {version = "3.6.7", optional = true}

[build-dependencies]
napi-build = {version = "2.4.3", optional = true}
