[package]
name = "fluxer-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arborium = { version = "=2.18.2", features = ["all-languages"] }
arborium-highlight = "=2.18.2"
arborium-theme = "=2.18.2"
fluxer-core.workspace = true
fluxer-protocol.workspace = true
gpui = "=0.2.2"
unicode-segmentation = "1.12"
fluxer-client.workspace = true
fluxer-media.workspace = true
serde.workspace = true
serde_json.workspace = true
image = "0.25"
smallvec = "1"
futures = "0.3"
log = "0.4"
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
chrono = "=0.4.45"
tempfile = "3"
zbus = "=5.19.0"
fluxer_markdown_parser = { path = "../../../packages/markdown_parser/rust" }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "=0.3.7", default-features = false, features = ["async-io", "blocking"] }

# Exercise the vendored Wayland serial/pipe helpers in the normal native gate.
[dev-dependencies]
collections = { package = "gpui_collections", version = "=0.2.2" }
libc = "0.2"
