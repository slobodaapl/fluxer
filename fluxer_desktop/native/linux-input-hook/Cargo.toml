[package]
name = "fluxer_linux_input_hook"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace]
resolver = "2"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["napi"]
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[dependencies]
napi = {version = "3.12.6", default-features = false, features = ["dyn-symbols", "napi8"], optional = true}
napi-derive = {version = "3.6.7", optional = true}

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = {version = "0.14.0", default-features = false, features = ["record"]}

[build-dependencies]
napi-build = {version = "2.4.3", optional = true}
