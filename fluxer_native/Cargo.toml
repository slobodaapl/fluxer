[workspace]
members = ["crates/core", "crates/protocol", "crates/desktop", "crates/media"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
fluxer-core = { path = "crates/core" }
fluxer-protocol = { path = "crates/protocol" }
fluxer-media = { path = "crates/media" }

